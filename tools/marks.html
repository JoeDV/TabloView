<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark commercial breaks</title>
<script src="/static/vendor/hls.min.js?v=1.5.20"></script>
<style>
  /* Developer tool (TABLOVIEW_DEV_TOOLS=1): mark where breaks really are, to check the finder against */
  :root { --bg: #0b0d12; --panel: #161a23; --line: #262c3a; --text: #e8ebf2; --dim: #9aa3b5; --accent: #5b8cff; --mark: #ef4c4c; --found: #8892a8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; display: flex; height: 100vh; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.red { background: var(--mark); border-color: var(--mark); color: #fff; }
  .side { width: 320px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side input { margin: 10px; padding: 7px 9px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
  .list { overflow-y: auto; flex: 1; }
  .rec { padding: 7px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .rec:hover, .rec.on { background: var(--panel); }
  .rec .t { font-weight: 600; } .rec .m { color: var(--dim); font-size: 12px; }
  .main { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px; min-width: 0; }
  video { width: 100%; max-height: 58vh; background: #000; border-radius: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pos { font: 600 20px/1 ui-monospace, Consolas, monospace; min-width: 120px; }
  .bar { position: relative; height: 34px; background: var(--panel); border-radius: 6px; cursor: pointer; overflow: hidden; }
  .bar .f, .bar .k { position: absolute; }
  .bar .f { top: 0; height: 50%; background: var(--found); opacity: 0.7; }
  .bar .k { bottom: 0; height: 50%; background: var(--mark); }
  .bar .now { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  .legend { color: var(--dim); font-size: 12px; }
  .barwrap { position: relative; }
  .hover { position: absolute; bottom: 42px; transform: translateX(-50%); background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 3px; pointer-events: none; z-index: 2; text-align: center; font: 600 13px ui-monospace, Consolas, monospace; }
  .hover img { display: block; width: 240px; height: 135px; object-fit: cover; border-radius: 4px; background: var(--panel); }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; }
  .mk { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .mk.start { border-left: 4px solid var(--mark); } .mk.end { border-left: 4px solid #3ecf8e; }
  .mk span { cursor: pointer; } .mk b { cursor: pointer; color: var(--dim); }
  .msg { color: var(--dim); }
  textarea { width: 100%; height: 48px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); padding: 6px; font: inherit; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
<div class="side">
  <input id="q" placeholder="Filter recordings">
  <div class="list" id="list"></div>
</div>
<div class="main">
  <div class="row"><b id="title">Pick a recording</b><span class="msg" id="msg"></span></div>
  <video id="v" playsinline></video>
  <div class="row">
    <span class="pos" id="pos">0:00</span>
    <button data-skip="-30">−30</button><button data-skip="-5">−5</button><button data-skip="-1">−1</button>
    <button id="play" class="primary">Play</button>
    <button data-skip="1">+1</button><button data-skip="5">+5</button><button data-skip="30">+30</button><button data-skip="120">+2 min</button>
    <input id="jump" placeholder="jump to m:ss" size="10" style="padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text)">
    <span style="flex:1"></span>
    <button class="red" id="mStart">Break starts <kbd>[</kbd></button>
    <button id="mEnd" style="border-left:4px solid #3ecf8e">Show's back <kbd>]</kbd></button>
  </div>
  <div class="barwrap"><div class="bar" id="bar"></div><div class="hover" id="hover" hidden><img id="hoverImg" alt=""><div id="hoverTime"></div></div></div>
  <div class="legend">Top grey: breaks the finder saved (this copy). Bottom red: your marks. Click the bar to jump. Keys: <kbd>Space</kbd> play/pause, <kbd>←</kbd><kbd>→</kbd> 5 s, <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 1 s, <kbd>[</kbd> break starts, <kbd>]</kbd> show's back. Saved as you go.</div>
  <div class="marks" id="marks"></div>
  <textarea id="note" placeholder="Notes (anything odd about this recording)"></textarea>
</div>
<script>
const $ = s => document.querySelector(s);
const H = { 'Content-Type': 'application/json', 'X-TabloView': '1' };
const api = async (url, o = {}) => { const r = await fetch(url, { headers: H, ...o }); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.json(); };
const clock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}`) + `:${String(x).padStart(2, '0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let recs = [], cur = null, marks = [], note = '', previews = [];
// The stream starts at `offset` seconds into the recording; jumping past what's converted starts it again
const st = { sid: null, offset: 0, hls: null, gen: 0 };
const v = $('#v');
const position = () => st.offset + (v.currentTime || 0);

async function load() {
  recs = (await api('/api/dev/recordings')).recordings;
  list();
}
function list() {
  const q = $('#q').value.toLowerCase();
  $('#list').innerHTML = recs.filter(r => !q || `${r.show_title} ${r.title} ${r.channel_name}`.toLowerCase().includes(q)).map(r => `
    <div class="rec ${cur && cur.id === r.id ? 'on' : ''}" data-id="${esc(r.id)}">
      <div class="t">${esc(r.show_title)}</div>
      <div class="m">${esc([r.season_number && r.episode_number ? `S${r.season_number}E${r.episode_number}` : '', r.title, (r.air_date || '').slice(0, 10), r.channel_name].filter(Boolean).join(' · '))}
        ${r.marks.length ? ` · <b style="color:var(--mark)">${r.marks.length} marks</b>` : ''}</div>
    </div>`).join('');
}

async function stop() {
  if (st.hls) { st.hls.destroy(); st.hls = null; }
  v.pause(); v.removeAttribute('src'); v.load();
  const id = st.sid; st.sid = null;
  if (id) await fetch('/api/live/stop', { method: 'POST', headers: H, body: JSON.stringify({ session_id: id }) }).catch(() => {});
}

async function start(at) {
  const gen = ++st.gen;
  await stop();
  st.offset = Math.max(0, Math.floor(at));
  $('#msg').textContent = 'Starting…';
  const res = await api(`/api/episodes/${encodeURIComponent(cur.id)}/watch?transcode=true&start=${st.offset}`, { method: 'POST' });
  if (gen !== st.gen) { fetch('/api/live/stop', { method: 'POST', headers: H, body: JSON.stringify({ session_id: res.session_id }) }); return; }
  st.sid = res.session_id;
  const hls = new Hls({ maxBufferLength: 60 });
  hls.loadSource(res.stream_url); hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  st.hls = hls;
  v.onplaying = () => { $('#msg').textContent = ''; };
}

function seek(t) {
  t = Math.max(0, Math.min(t, (cur.duration || 1e9) + 300));
  const rel = t - st.offset;
  const w = v.seekable && v.seekable.length ? v.seekable.end(v.seekable.length - 1) : 0;
  if (rel >= 0 && rel <= w - 1) v.currentTime = rel; else start(t);
}

// The Tablo's preview images for the whole recording (fetched once playback has started)
async function loadPreviews(id) {
  previews = [];
  for (let i = 0; i < 8 && cur && cur.id === id; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try { const res = await api(`/api/episodes/${encodeURIComponent(id)}/previews`); if (res.times && res.times.length) { previews = res.times; return; } } catch { /* again */ }
  }
}
function previewUrl(t) {
  if (!previews.length) return st.sid ? `/api/transcoded/${st.sid}/p${String(Math.floor(t / 5)).padStart(5, '0')}.jpg` : '';
  let n = 0;
  while (n + 1 < previews.length && previews[n + 1] <= t) n++;
  return `/api/episodes/${encodeURIComponent(cur.id)}/previews/${n}`;
}

async function open(id) {
  cur = recs.find(r => r.id === id);
  loadPreviews(id);
  $('#title').textContent = `${cur.show_title} · ${cur.title || ''} (${cur.channel_name || ''})`;
  const saved = await api(`/api/dev/marks/${encodeURIComponent(id)}`);
  marks = saved.marks; note = saved.note || ''; $('#note').value = note;
  list(); draw(); start(0);
}

async function save() {
  const res = await api(`/api/dev/marks/${encodeURIComponent(cur.id)}`, { method: 'PUT', body: JSON.stringify({ marks, note: $('#note').value }) });
  if (Array.isArray(res.marks)) marks = res.marks;
  cur.marks = marks; list(); draw();
}

function mark(kind) {
  if (!cur) return;
  marks.push({ t: Math.round(position() * 10) / 10, kind });
  save();
}

function draw() {
  if (!cur) return;
  const dur = Math.max(cur.duration || 0, ...marks.map(m => m.t), 60) + 120;
  const pct = t => `${(t / dur) * 100}%`;
  const pairs = []; let open = null;
  for (const m of [...marks].sort((a, b) => a.t - b.t)) {
    if (m.kind === 'start') open = m.t; else if (open !== null) { pairs.push([open, m.t]); open = null; }
  }
  $('#bar').innerHTML = cur.found.map(b => `<div class="f" style="left:${pct(b.start)};width:${pct(b.end - b.start)}" title="found ${clock(b.start)}-${clock(b.end)}"></div>`).join('')
    + pairs.map(([a, b]) => `<div class="k" style="left:${pct(a)};width:${pct(b - a)}" title="marked ${clock(a)}-${clock(b)}"></div>`).join('')
    + `<div class="now" id="now"></div>`;
  $('#bar').dataset.dur = dur;
  $('#marks').innerHTML = [...marks].map((m, i) => ({ ...m, i })).sort((a, b) => a.t - b.t).map(m =>
    `<div class="mk ${m.kind}"><span data-go="${m.t}" title="Jump a few seconds before">${clock(m.t)} ${m.kind === 'start' ? 'break starts' : "show's back"}</span><b data-del="${m.i}" title="Remove">✕</b></div>`).join('');
}

setInterval(() => {
  if (!cur) return;
  const p = position();
  $('#pos').textContent = clock(p) + (v.paused ? ' ❚❚' : '');
  $('#play').textContent = v.paused ? 'Play' : 'Pause';
  const now = $('#now'); if (now) now.style.left = `${(p / Number($('#bar').dataset.dur)) * 100}%`;
}, 250);
// Keep the stream from being closed as unused (paused too)
setInterval(() => { if (st.sid) fetch('/api/live/alive', { method: 'POST', headers: H, body: JSON.stringify({ session_ids: [st.sid] }) }).catch(() => {}); }, 60000);
window.addEventListener('pagehide', () => { if (st.sid) fetch('/api/live/stop', { method: 'POST', headers: H, body: JSON.stringify({ session_id: st.sid }), keepalive: true }); });

$('#list').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) open(r.dataset.id); });
$('#q').addEventListener('input', list);
$('#play').addEventListener('click', () => (v.paused ? v.play() : v.pause()));
document.querySelectorAll('[data-skip]').forEach(b => b.addEventListener('click', () => seek(position() + Number(b.dataset.skip))));
$('#mStart').addEventListener('click', () => mark('start'));
$('#mEnd').addEventListener('click', () => mark('end'));
$('#jump').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const p = $('#jump').value.trim().split(':').map(Number);
  if (p.some(isNaN)) return;
  seek(p.reduce((a, x) => a * 60 + x, 0)); $('#jump').blur();
});
$('#bar').addEventListener('mousemove', e => {
  if (!cur) return;
  const r = $('#bar').getBoundingClientRect();
  const t = ((e.clientX - r.left) / r.width) * Number($('#bar').dataset.dur);
  const h = $('#hover');
  h.hidden = false;
  h.style.left = `${Math.max(124, Math.min(r.width - 124, e.clientX - r.left))}px`;
  const url = previewUrl(t);
  if (url && $('#hoverImg').dataset.src !== url) { $('#hoverImg').src = url; $('#hoverImg').dataset.src = url; }
  $('#hoverTime').textContent = clock(t);
});
$('#bar').addEventListener('mouseleave', () => { $('#hover').hidden = true; });
$('#bar').addEventListener('click', e => { if (!cur) return; const r = $('#bar').getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * Number($('#bar').dataset.dur)); });
$('#marks').addEventListener('click', e => {
  const go = e.target.closest('[data-go]'), del = e.target.closest('[data-del]');
  if (go) seek(Number(go.dataset.go) - 3);
  if (del) { marks.splice(Number(del.dataset.del), 1); save(); }
});
$('#note').addEventListener('change', save);
document.addEventListener('keydown', e => {
  if (!cur || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const step = e.shiftKey ? 1 : 5;
  const keys = { ' ': () => (v.paused ? v.play() : v.pause()), ArrowLeft: () => seek(position() - step), ArrowRight: () => seek(position() + step),
                 '[': () => mark('start'), ']': () => mark('end') };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});
load().catch(err => { $('#title').textContent = `Couldn't load recordings: ${err.message}`; });
</script>
</body>
</html>
