<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <title>TabloView Remote</title>
  <meta name="description" content="Use your phone as the remote for TabloView's TV view: buttons, channels and shows.">
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=1">
  <link rel="stylesheet" href="/static/remote.css?v=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Crect x='7' y='10' width='18' height='13' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m12 6 4 4 4-4' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <main class="app" id="app">
    <header class="top">
      <div class="brand">TabloView <span>Remote</span></div>
      <select id="screenPick" class="screen-pick hidden" aria-label="Which screen"></select>
    </header>

    <section class="now" id="now">
      <div class="now-label" id="nowLabel">Looking for TV screens…</div>
      <div class="now-title" id="nowTitle"></div>
      <div class="now-sub" id="nowSub"></div>
    </section>

    <div id="controls" class="controls hidden">
      <form class="search" id="searchForm" autocomplete="off">
        <input id="search" type="search" placeholder="Channel or show (e.g. 7.1, CBS, Jeopardy)" enterkeyhint="search" aria-label="Find a channel or show">
      </form>
      <div class="results hidden" id="results"></div>

      <button class="skip hidden" id="skipBreak" data-cmd="skipbreak">Skip break ▶▶</button>

      <div class="pad" aria-label="Arrows">
        <button class="pad-btn up" data-key="up" aria-label="Up">▲</button>
        <button class="pad-btn left" data-key="left" aria-label="Left">◀</button>
        <button class="pad-btn ok" data-key="ok">OK</button>
        <button class="pad-btn right" data-key="right" aria-label="Right">▶</button>
        <button class="pad-btn down" data-key="down" aria-label="Down">▼</button>
      </div>

      <div class="row">
        <button class="btn" data-key="back">↩ Back</button>
        <button class="btn" data-key="home">⌂ Home</button>
      </div>

      <div class="row three">
        <button class="btn" data-key="rewind" aria-label="Back 10 seconds">⟲ 10</button>
        <button class="btn play" data-key="playpause" id="playBtn" aria-label="Play or pause">⏯</button>
        <button class="btn" data-key="forward" aria-label="Forward 30 seconds">30 ⟳</button>
      </div>

      <div class="row channels" id="chRow">
        <button class="btn" data-key="chdown">CH −</button>
        <button class="btn" data-key="chup">CH +</button>
      </div>
    </div>

    <div class="empty hidden" id="empty">
      <p><b>No TV screen is open.</b></p>
      <p>Open TabloView on the TV: the TabloView TV app, or this PC's address plus <b>/tv</b> in the TV's browser. It shows up here within a few seconds.</p>
    </div>

    <div class="empty hidden" id="blocked"></div>

    <form class="pin hidden" id="pinForm">
      <p><b>Enter the PIN</b></p>
      <p>The PIN set on the PC running TabloView. This phone is remembered afterwards.</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" aria-label="PIN">
      <div class="error" id="pinError"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/static/remote.js?v=2"></script>
</body>
</html>
