<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabloView TV</title>
  <meta name="description" content="TabloView for a TV's browser: continue watching, recordings and live TV with a remote.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="/static/vendor/hls.min.js?v=1.5.20"></script>
  <link rel="stylesheet" href="/static/tv.css?v=4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Crect x='7' y='10' width='18' height='13' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m12 6 4 4 4-4' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top" id="top">
    <div class="brand">TabloView</div>
    <nav class="tabs">
      <button class="tab f" data-go="#/" data-key="tab-home">Continue watching</button>
      <button class="tab f" data-go="#/recordings" data-key="tab-recordings">Recordings</button>
      <button class="tab f" data-go="#/live" data-key="tab-live">Live TV</button>
      <button class="tab f" data-go="#/watchlist" data-key="tab-watchlist">Watch list</button>
    </nav>
    <div class="clock" id="clock"></div>
    <button class="tab f" data-act="pc-view" data-key="tab-pc">PC view</button>
  </header>
  <main class="screen" id="screen"></main>

  <div class="player hidden" id="player">
    <video id="video" playsinline></video>
    <div class="osd" id="osd">
      <div class="osd-title" id="osdTitle"></div>
      <div class="osd-sub" id="osdSub"></div>
      <div class="osd-bar"><div class="osd-played" id="osdPlayed"></div></div>
      <div class="osd-times"><span id="osdNow"></span><span id="osdHint"></span><span id="osdEnd"></span></div>
      <div class="osd-controls hidden" id="osdControls"></div>
    </div>
    <div class="osd-msg hidden" id="osdMsg"></div>
  </div>

  <div class="dialog hidden" id="dialog"></div>
  <script src="/static/tv.js?v=13"></script>
</body>
</html>
