<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabloView</title>
  <meta name="description" content="Recordings, guide, live TV and series scheduling for your Tablo 4th Gen DVR.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="/static/vendor/hls.min.js?v=1.5.20"></script>
  <link rel="stylesheet" href="/static/styles.css?v=31">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Crect x='7' y='10' width='18' height='13' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m12 6 4 4 4-4' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" data-icon="tv"></div>
        <div class="brand-text">
          <div class="brand-name">TabloView</div>
          <div class="brand-device" id="deviceName">Connectingâ€¦</div>
        </div>
      </div>

      <a class="nav-item" href="#/" data-nav="home" title="Home"><i data-icon="home"></i><span>Home</span></a>
      <a class="nav-item" href="#/library" data-nav="library" title="Library"><i data-icon="library"></i><span>Library</span><span class="nav-count" id="navLibraryCount"></span></a>
      <a class="nav-item" href="#/guide" data-nav="guide" title="Guide"><i data-icon="guide"></i><span>Guide</span></a>
      <a class="nav-item" href="#/live" data-nav="live" title="Live TV"><i data-icon="live"></i><span>Live TV</span><span class="nav-count" id="navLiveCount"></span></a>
      <a class="nav-item" href="#/scheduled" data-nav="scheduled" title="Scheduled"><i data-icon="calendar"></i><span>Scheduled</span><span class="nav-count" id="navScheduledCount"></span></a>

      <div class="nav-spacer"></div>

      <a class="nav-item" href="#/downloads" data-nav="downloads" title="Downloads"><i data-icon="download"></i><span>Downloads</span><span class="nav-count" id="navDownloadsCount"></span></a>
      <a class="nav-item" href="#/device" data-nav="device" title="Device"><i data-icon="settings"></i><span>Device</span></a>

      <a class="update-notice hidden" id="updateNotice" target="_blank" rel="noopener" title="Download the new version">
        <i data-icon="download" data-size="16"></i><span id="updateNoticeText">Update available</span>
      </a>

      <div class="sidebar-status">
        <div>
          <div class="meter-row"><span id="storageUsed">Storage</span><span id="storageFree"></span></div>
          <div class="meter"><div class="meter-fill" id="storageFill" style="width:0%"></div></div>
        </div>
        <div class="sync-line"><span class="sync-dot off" id="syncDot"></span><span id="syncText">Not synced yet</span></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="topbar-back" id="backBtn" title="Back" data-action="back"><i data-icon="back"></i></button>
        <div class="global-search">
          <i class="search-icon" data-icon="search"></i>
          <input id="globalSearch" type="text" placeholder="Search recordings and the guide" autocomplete="off" spellcheck="false">
          <span class="kbd">/</span>
          <div class="search-results hidden" id="searchResults"></div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-ghost btn-sm" data-action="refresh-library" id="topRefreshBtn" title="Sync recordings from your Tablo">
            <i data-icon="refresh"></i><span>Sync</span>
          </button>
        </div>
      </header>
      <div class="auth-banner hidden" id="authBanner" role="alert">
        <i data-icon="alert" data-size="16"></i>
        <span id="authBannerText">Your Tablo sign-in has expired.</span>
        <span class="dim">Recordings and live TV may not load until you sign in again.</span>
        <button class="btn btn-sm btn-primary" data-action="reauth">Sign in again</button>
      </div>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount">0 selected</span>
    <button class="btn btn-sm btn-danger" data-action="bulk-delete"><i data-icon="trash"></i>Delete</button>
    <button class="btn btn-sm btn-ghost" data-action="bulk-clear">Clear</button>
  </div>

  <div class="player hidden" id="player">
    <div class="player-top">
      <button class="icon-btn" data-action="close-player" title="Close (Esc)"><i data-icon="back"></i></button>
      <div>
        <div class="player-title" id="playerTitle"></div>
        <div class="player-status" id="playerStatus"></div>
      </div>
      <div class="player-tools">
        <select class="select" id="bufferSelect" title="Seconds to buffer before playback starts">
          <option value="4">4s buffer</option>
          <option value="8">8s buffer</option>
          <option value="15">15s buffer</option>
          <option value="30">30s buffer</option>
        </select>
        <button class="btn btn-sm" data-action="player-vlc" title="Open this stream in VLC"><i data-icon="external"></i>Open in VLC</button>
      </div>
    </div>
    <video id="video" playsinline></video>
    <div class="player-timeline hidden" id="playerTimeline">
      <div class="tl-row">
        <span class="tl-time" id="tlNow">0:00</span>
        <div class="tl-track" id="tlTrack">
          <div class="tl-avail" id="tlAvail"></div>
          <div class="tl-played" id="tlPlayed"></div>
          <div class="tl-hover hidden" id="tlHover"></div>
        </div>
        <span class="tl-time" id="tlTotal">0:00</span>
        <button class="pb-live hidden" id="pbLive" data-action="pb-live" title="Jump to live">LIVE</button>
      </div>
      <div class="pb-controls">
        <button class="pb-btn" data-action="pb-back" title="Back 10 seconds (←)"><i data-icon="rewind"></i></button>
        <button class="pb-btn pb-main" data-action="pb-play" id="pbPlay" title="Pause (Space)"><i data-icon="pause" data-size="22"></i></button>
        <button class="pb-btn" data-action="pb-fwd" title="Ahead 30 seconds (→)"><i data-icon="forward"></i></button>
        <button class="pb-btn" data-action="pb-mute" id="pbMute" title="Mute (M)"><i data-icon="volume"></i></button>
        <input type="range" class="pb-volume" id="pbVolume" min="0" max="1" step="0.05" value="1" title="Volume (↑ ↓)">
        <div class="grow"></div>
        <select class="pb-speed" id="pbSpeed" title="Playback speed (&lt; &gt;)">
          <option value="1">1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        </select>
        <button class="pb-btn" data-action="pb-help" title="Keyboard shortcuts (?)"><i data-icon="keyboard"></i></button>
        <button class="pb-btn" data-action="pb-pip" title="Picture in picture (P)"><i data-icon="pip"></i></button>
        <button class="pb-btn" data-action="pb-full" title="Full screen (F)"><i data-icon="fullscreen"></i></button>
      </div>
    </div>
    <div class="upnext hidden" id="upNext"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="/static/app.js?v=41"></script>
</body>
</html>
