# TabloView on a home server: see DOCKER.md. Nothing to change in this file:
#   cp tabloview.env.example tabloview.env     then put your values in tabloview.env
#   docker compose up -d --build
# Your own files (tabloview.env, docker-compose.override.yml) aren't part of TabloView's files, so
# `git pull` never conflicts with them.
services:
  tabloview:
    build: .
    container_name: tabloview
    restart: unless-stopped
    # Required: TabloView finds your Tablo, and TVs and players find TabloView, on the home network
    network_mode: host
    # Your Tablo sign-in, PIN, time zone and the computers that can change every setting
    env_file:
      - tabloview.env
    volumes:
      - ./tabloview-data:/data           # settings, sign-in and cache
      - ./exports:/data/downloads        # MP4 exports
# Intel graphics for converting: cp docker-compose.override.example.yml docker-compose.override.yml
